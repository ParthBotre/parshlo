name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub Environment to deploy'
        type: choice
        required: true
        options: [staging, production]

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.21.0'
  PNPM_VERSION: '9.15.0'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      WEB_DEPLOY_HOOK_URL: ${{ secrets.WEB_DEPLOY_HOOK_URL }}
      API_DEPLOY_HOOK_URL: ${{ secrets.API_DEPLOY_HOOK_URL }}
      WORKER_DEPLOY_HOOK_URL: ${{ secrets.WORKER_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @parshlo/db generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm build

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Backup database before migration
        run: |
          test -n "$DATABASE_URL"
          mkdir -p backups
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --file "backups/${{ inputs.environment }}-${{ github.sha }}.dump"

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ inputs.environment }}-${{ github.sha }}
          path: backups/*.dump
          retention-days: 30

      - name: Apply migrations
        run: pnpm --filter @parshlo/db migrate

      - name: Trigger web deploy
        if: env.WEB_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$WEB_DEPLOY_HOOK_URL"

      - name: Trigger API deploy
        if: env.API_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$API_DEPLOY_HOOK_URL"

      - name: Trigger worker deploy
        if: env.WORKER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$WORKER_DEPLOY_HOOK_URL"

      - name: Deployment notes
        run: |
          echo "Deploy workflow completed for ${{ inputs.environment }}."
          echo "If no deploy hooks were configured, migrations/checks ran but services were not redeployed."
