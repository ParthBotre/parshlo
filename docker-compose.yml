name: parshlo

services:
  postgres:
    image: postgres:16-alpine
    container_name: parshlo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parshlo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parshlo_dev}
      POSTGRES_DB: ${POSTGRES_DB:-parshlo}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - parshlo-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-parshlo} -d ${POSTGRES_DB:-parshlo}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: parshlo-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - parshlo-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # MailHog: SMTP catch-all for dev — view emails at http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    container_name: parshlo-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  # LocalStack: AWS-compatible S3 for dev/test
  localstack:
    image: localstack/localstack:3.8
    container_name: parshlo-localstack
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEFAULT_REGION: ap-south-1
      DEBUG: '0'
      PERSISTENCE: '1'
    ports:
      - '4566:4566'
    volumes:
      - parshlo-localstack-data:/var/lib/localstack
      - ./infra/docker/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro

volumes:
  parshlo-pg-data:
  parshlo-redis-data:
  parshlo-localstack-data:
